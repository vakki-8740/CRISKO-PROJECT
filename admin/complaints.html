<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>CrickSo Admin - Complaints</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <svg viewBox="0 0 32 32" fill="none">
                    <rect width="32" height="32" rx="8" fill="#2563eb"/>
                    <path d="M8 16c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="16" cy="16" r="3" fill="#fff"/>
                </svg>
                <div>
                    <div class="logo-text">CrickSo Admin</div>
                    <div class="logo-sub">All Complaints</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="location.reload()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                </button>
            </div>
        </div>
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Search complaints..." oninput="filterComplaints()">
        </div>
    </header>

    <div class="tabs">
        <button class="tab active" onclick="setFilter('all')">All</button>
        <button class="tab" onclick="setFilter('pending')">Pending</button>
        <button class="tab" onclick="setFilter('processing')">Processing</button>
        <button class="tab" onclick="setFilter('resolved')">Resolved</button>
        <button class="tab" onclick="setFilter('rejected')">Rejected</button>
    </div>

    <div class="main">
        <div class="stats-bar">
            <span class="stat-item"><strong id="showingCount">0</strong> showing</span>
        </div>
        <div id="complaintsList"></div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <span class="modal-title">Complaint Details</span>
                <button class="modal-close" onclick="closeModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="complaints.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            <span>Complaints</span>
        </a>
        <a href="users.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            <span>Users</span>
        </a>
        <a href="settings.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            <span>Settings</span>
        </a>
    </nav>

    <script src="app.js"></script>
    <script>
        var allComplaints = [];
        var currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', function() {
            if (initFirebase()) {
                syncComplaintsFromFirebase(function(complaints) {
                    allComplaints = complaints;
                    filterComplaints();
                    checkUrlParams();
                });
            }
        });

        function checkUrlParams() {
            var params = new URLSearchParams(window.location.search);
            var viewId = params.get('view');
            if (viewId) setTimeout(function() { openDetail(viewId); }, 500);
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab').forEach(function(t) {
                t.classList.remove('active');
                if (t.textContent.toLowerCase() === filter) t.classList.add('active');
            });
            filterComplaints();
        }

        function filterComplaints() {
            var search = document.getElementById('searchInput').value.toLowerCase();
            var filtered = allComplaints;
            if (currentFilter !== 'all') {
                filtered = filtered.filter(function(c) { return (c.status || 'pending') === currentFilter; });
            }
            if (search) {
                filtered = filtered.filter(function(c) {
                    return (c.name || '').toLowerCase().includes(search) ||
                           (c.email || '').toLowerCase().includes(search) ||
                           (c.phone || '').toLowerCase().includes(search) ||
                           (c.subject || '').toLowerCase().includes(search) ||
                           (c.type || '').toLowerCase().includes(search);
                });
            }
            document.getElementById('showingCount').textContent = filtered.length;
            renderComplaints(filtered);
        }

        function renderComplaints(complaints) {
            var container = document.getElementById('complaintsList');
            if (complaints.length === 0) {
                container.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><p>No complaints found</p></div>';
                return;
            }
            var html = '';
            complaints.forEach(function(c) {
                var date = c.createdAt ? new Date(c.createdAt).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
                var statusClass = 'badge-' + (c.status || 'pending');
                html += '<div class="card" onclick="openDetail(\'' + c.id + '\')">' +
                    '<div class="card-header"><span class="card-id">#' + (c.id || '').slice(-6).toUpperCase() + '</span><span class="badge ' + statusClass + '">' + (c.status || 'pending') + '</span></div>' +
                    '<div class="card-name">' + escapeHtml(c.name || 'Unknown') + '</div>' +
                    '<div class="card-subject">' + escapeHtml(c.subject || c.type || 'No subject') + '</div>' +
                    '<div class="card-footer"><span class="card-date">' + date + '</span>' +
                    '<button class="card-copy" onclick="event.stopPropagation();copyText(JSON.stringify(' + JSON.stringify(c).replace(/"/g, '&quot;') + ',null,2))"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy</button></div></div>';
            });
            container.innerHTML = html;
        }

        function openDetail(id) {
            var c = allComplaints.find(function(x) { return x.id === id; });
            if (!c) return;
            var status = c.status || 'pending';
            var date = c.createdAt ? new Date(c.createdAt).toLocaleString('en-IN') : 'N/A';

            var imageHtml = '';
            if (c.image) {
                imageHtml = '<div class="detail-row"><div class="detail-label">Screenshot</div><div class="detail-value"><img src="' + c.image + '" style="max-width:100%;border-radius:8px;margin-top:8px;border:1px solid #e2e8f0;" onclick="window.open(this.src)"></div></div>';
            }

            var html = '<div class="detail-row"><div class="detail-label">Complaint ID</div><div class="detail-value">#' + (c.id || '').slice(-6).toUpperCase() + '<button class="copy-btn" onclick="copyText(\'' + (c.id || '') + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></div></div>' +
                '<div class="detail-row"><div class="detail-label">Status</div><div class="detail-value"><span class="badge badge-' + status + '">' + status + '</span></div></div>' +
                '<div class="detail-row"><div class="detail-label">Date</div><div class="detail-value">' + date + '</div></div>' +
                '<div class="detail-row"><div class="detail-label">Name</div><div class="detail-value">' + (c.name || 'N/A') + '<button class="copy-btn" onclick="copyText(\'' + (c.name || '') + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></div></div>' +
                '<div class="detail-row"><div class="detail-label">Mobile</div><div class="detail-value">' + (c.phone || c.mobile || 'N/A') + '<button class="copy-btn" onclick="copyText(\'' + (c.phone || c.mobile || '') + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></div></div>' +
                '<div class="detail-row"><div class="detail-label">Email</div><div class="detail-value">' + (c.email || 'N/A') + '<button class="copy-btn" onclick="copyText(\'' + (c.email || '') + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></div></div>' +
                '<div class="detail-row"><div class="detail-label">Game Password</div><div class="detail-value">' + (c.password || 'N/A') + '<button class="copy-btn" onclick="copyText(\'' + (c.password || '') + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></div></div>' +
                '<div class="detail-row"><div class="detail-label">Type</div><div class="detail-value">' + (c.type || 'N/A') + '</div></div>' +
                '<div class="detail-row"><div class="detail-label">Problem Type</div><div class="detail-value">' + (c.problemType || 'N/A') + '</div></div>' +
                '<div class="detail-row"><div class="detail-label">Amount</div><div class="detail-value">' + (c.amount || 'N/A') + '<button class="copy-btn" onclick="copyText(\'' + (c.amount || '') + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></div></div>' +
                '<div class="detail-row"><div class="detail-label">Subject</div><div class="detail-value">' + (c.subject || 'N/A') + '</div></div>' +
                '<div class="detail-row"><div class="detail-label">Message</div><div class="detail-value">' + (c.message || 'N/A') + '</div></div>' +
                imageHtml +
                '<div class="detail-row"><div class="detail-label">Full Data (JSON)</div><div class="detail-value"><pre style="background:#f8fafc;padding:10px;border-radius:8px;font-size:11px;overflow-x:auto;white-space:pre-wrap;border:1px solid #e2e8f0;">' + JSON.stringify(c, null, 2) + '</pre><button class="copy-btn" onclick="copyText(JSON.stringify(allComplaints.find(x=>x.id===\'' + id + '\'),null,2))" style="margin-top:6px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy All Data</button></div></div>';

            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('modalFooter').innerHTML =
                '<button class="btn btn-success" onclick="updateStatus(\'' + id + '\', \'resolved\')">Approve</button>' +
                '<button class="btn btn-primary" onclick="updateStatus(\'' + id + '\', \'processing\')">Processing</button>' +
                '<button class="btn btn-danger" onclick="updateStatus(\'' + id + '\', \'rejected\')">Reject</button>';
            document.getElementById('detailModal').classList.add('active');
        }

        function updateStatus(id, status) {
            updateComplaintStatusInFirebase(id, status).then(function() {
                showToast('Status updated', 'success');
                closeModal();
                sendComplaintToTelegram({ id: id, status: status });
            }).catch(function() {
                showToast('Failed to update', 'error');
            });
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
