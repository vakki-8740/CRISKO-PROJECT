<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0a1628">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CrickSo Admin - Complaints</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="logo">
        <svg viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#2563eb"/>
          <path d="M8 16c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="3" fill="#fff"/>
        </svg>
        <div>
          <div class="logo-text">CrickSo Admin</div>
          <div class="logo-sub">Complaint Management</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-btn" onclick="refreshComplaints()" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M20.49 9A9 9 0 005.64 5.64L4 4m16 16l-1.64-1.64A9 9 0 014.51 15"/></svg>
        </button>
      </div>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search complaints..." oninput="filterComplaints()">
    </div>
  </header>

  <div class="stats-bar" id="statsBar">
    <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-num" id="statPending" style="color:var(--yellow)">0</div><div class="stat-label">Pending</div></div>
    <div class="stat-card"><div class="stat-num" id="statProcessing" style="color:var(--blue-light)">0</div><div class="stat-label">Processing</div></div>
    <div class="stat-card"><div class="stat-num" id="statResolved" style="color:var(--green)">0</div><div class="stat-label">Resolved</div></div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-filter="all" onclick="setTab(this)">All<span class="tab-count" id="countAll">0</span></div>
    <div class="tab" data-filter="pending" onclick="setTab(this)">Pending<span class="tab-count" id="countPending">0</span></div>
    <div class="tab" data-filter="processing" onclick="setTab(this)">Processing<span class="tab-count" id="countProcessing">0</span></div>
    <div class="tab" data-filter="resolved" onclick="setTab(this)">Resolved<span class="tab-count" id="countResolved">0</span></div>
    <div class="tab" data-filter="rejected" onclick="setTab(this)">Rejected<span class="tab-count" id="countRejected">0</span></div>
  </div>

  <div class="main" id="complaintsList">
    <div class="loading-spinner"><div class="spinner"></div></div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <span class="modal-title">Complaint Details</span>
        <button class="modal-close" onclick="closeModal('detailModal')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="detailBody"></div>
      <div class="modal-footer" id="detailFooter"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a class="nav-item" href="./complaints.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2"/></svg>
      <span>Home</span>
    </a>
    <a class="nav-item active" href="./complaints.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
      <span>Complaints</span>
    </a>
    <a class="nav-item" href="./users.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <span>Users</span>
    </a>
    <a class="nav-item" href="./settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <script src="./app.js"></script>
  <script>
    let allComplaints = [];
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      if (!initFirebase()) {
        showToast('Firebase init failed', 'error');
        return;
      }
      syncComplaintsFromFirebase(list => {
        allComplaints = list;
        updateStats();
        renderComplaints();
      });
    });

    function updateStats() {
      const total = allComplaints.length;
      const pending = allComplaints.filter(c => c.status === 'pending').length;
      const processing = allComplaints.filter(c => c.status === 'processing').length;
      const resolved = allComplaints.filter(c => c.status === 'resolved').length;
      const rejected = allComplaints.filter(c => c.status === 'rejected').length;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statProcessing').textContent = processing;
      document.getElementById('statResolved').textContent = resolved;
      document.getElementById('countAll').textContent = total;
      document.getElementById('countPending').textContent = pending;
      document.getElementById('countProcessing').textContent = processing;
      document.getElementById('countResolved').textContent = resolved;
      document.getElementById('countRejected').textContent = rejected;
    }

    function setTab(el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      currentFilter = el.dataset.filter;
      renderComplaints();
    }

    function filterComplaints() {
      renderComplaints();
    }

    function renderComplaints() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      let filtered = allComplaints;
      if (currentFilter !== 'all') {
        filtered = filtered.filter(c => c.status === currentFilter);
      }
      if (query) {
        filtered = filtered.filter(c =>
          (c.name || '').toLowerCase().includes(query) ||
          (c.email || '').toLowerCase().includes(query) ||
          (c.subject || '').toLowerCase().includes(query) ||
          (c.type || '').toLowerCase().includes(query) ||
          (c.id || '').toLowerCase().includes(query)
        );
      }
      const container = document.getElementById('complaintsList');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>' +
          '<h3>No complaints found</h3><p>There are no complaints matching your criteria.</p></div>';
        return;
      }
      container.innerHTML = filtered.map(c => createComplaintCard(c)).join('');
    }

    function refreshComplaints() {
      showToast('Refreshing...', 'info');
    }

    function openComplaintDetail(id) {
      const c = allComplaints.find(x => x.id === id);
      if (!c) return;
      const statusClass = 'status-' + (c.status || 'pending');
      let html = '<div class="modal-section"><div class="modal-label">Complaint ID</div><div class="modal-value modal-value-header"><span id="detailId">#' + (c.id || '').slice(-6).toUpperCase() + '</span><button class="modal-copy-btn" onclick="copyText(\'' + escapeAttr(c.id) + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy ID</button></div></div>';
      html += '<div class="modal-section"><div class="modal-label">Status</div><div class="modal-value"><span class="card-status ' + statusClass + '">' + (c.status || 'pending') + '</span></div></div>';
      html += '<div class="modal-section"><div class="modal-label">Name</div><div class="modal-value modal-value-header"><span id="detailName">' + escapeHtml(c.name || 'Unknown') + '</span><button class="modal-copy-btn" onclick="copyField(\'detailName\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy</button></div></div>';
      if (c.email) html += '<div class="modal-section"><div class="modal-label">Email</div><div class="modal-value modal-value-header"><span id="detailEmail">' + escapeHtml(c.email) + '</span><button class="modal-copy-btn" onclick="copyField(\'detailEmail\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy</button></div></div>';
      if (c.phone) html += '<div class="modal-section"><div class="modal-label">Phone</div><div class="modal-value modal-value-header"><span id="detailPhone">' + escapeHtml(c.phone) + '</span><button class="modal-copy-btn" onclick="copyField(\'detailPhone\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy</button></div></div>';
      html += '<div class="modal-section"><div class="modal-label">Subject</div><div class="modal-value">' + escapeHtml(c.subject || c.type || 'N/A') + '</div></div>';
      if (c.message || c.description) html += '<div class="modal-section"><div class="modal-label">Message</div><div class="modal-value">' + escapeHtml(c.message || c.description) + '</div></div>';
      html += '<div class="modal-section"><div class="modal-label">Created</div><div class="modal-value">' + formatDate(c.createdAt) + '</div></div>';
      if (c.updatedAt) html += '<div class="modal-section"><div class="modal-label">Updated</div><div class="modal-value">' + formatDate(c.updatedAt) + '</div></div>';
      if (c.adminNote) html += '<div class="modal-section"><div class="modal-label">Admin Note</div><div class="modal-value">' + escapeHtml(c.adminNote) + '</div></div>';
      document.getElementById('detailBody').innerHTML = html;

      let footer = '';
      if (c.status === 'pending') {
        footer = '<button class="btn btn-processing" onclick="updateStatus(\'' + c.id + '\',\'processing\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Process</button>' +
          '<button class="btn btn-approve" onclick="updateStatus(\'' + c.id + '\',\'resolved\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Resolve</button>' +
          '<button class="btn btn-reject" onclick="updateStatus(\'' + c.id + '\',\'rejected\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Reject</button>';
      } else if (c.status === 'processing') {
        footer = '<button class="btn btn-approve" onclick="updateStatus(\'' + c.id + '\',\'resolved\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Resolve</button>' +
          '<button class="btn btn-reject" onclick="updateStatus(\'' + c.id + '\',\'rejected\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Reject</button>';
      } else {
        footer = '<button class="btn btn-secondary" onclick="updateStatus(\'' + c.id + '\',\'pending\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M20.49 9A9 9 0 005.64 5.64L4 4m16 16l-1.64-1.64A9 9 0 014.51 15"/></svg>Reset to Pending</button>';
      }
      footer += '<button class="btn btn-secondary" onclick="copyText(\'' + escapeAttr(JSON.stringify(c, null, 2)) + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy All</button>';
      document.getElementById('detailFooter').innerHTML = footer;
      document.getElementById('detailModal').classList.add('active');
    }

    async function updateStatus(id, status) {
      try {
        await updateComplaintStatusInFirebase(id, status);
        showToast('Status updated to ' + status, 'success');
        closeModal('detailModal');
      } catch (e) {
        showToast('Failed to update status', 'error');
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    document.getElementById('detailModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal('detailModal');
    });
  </script>
</body>
</html>
