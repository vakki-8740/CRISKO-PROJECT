<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>CrickSo Admin - Users</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <svg viewBox="0 0 32 32" fill="none">
                    <rect width="32" height="32" rx="8" fill="#2563eb"/>
                    <path d="M8 16c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="16" cy="16" r="3" fill="#fff"/>
                </svg>
                <div>
                    <div class="logo-text">CrickSo Admin</div>
                    <div class="logo-sub">Users</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="location.reload()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                </button>
            </div>
        </div>
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Search users..." oninput="filterUsers()">
        </div>
    </header>

    <div class="main">
        <div class="stats-bar">
            <span class="stat-item"><strong id="totalUsers">0</strong> users</span>
        </div>
        <div id="usersList"></div>
    </div>

    <div class="modal-overlay" id="userModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <span class="modal-title">User Details</span>
                <button class="modal-close" onclick="closeModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body" id="userModalBody"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="complaints.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            <span>Complaints</span>
        </a>
        <a href="users.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            <span>Users</span>
        </a>
        <a href="settings.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            <span>Settings</span>
        </a>
    </nav>

    <script src="app.js"></script>
    <script>
        var allUsers = [];
        var colors = ['#2563eb','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4'];

        document.addEventListener('DOMContentLoaded', function() {
            if (initFirebase()) {
                db.ref('users').on('value', function(snap) {
                    var data = snap.val() || {};
                    allUsers = Object.keys(data).map(function(k) {
                        return Object.assign({}, data[k], { uid: k });
                    });
                    allUsers.sort(function(a, b) { return new Date(b.createdAt || 0) - new Date(a.createdAt || 0); });
                    filterUsers();
                });
            }
        });

        function filterUsers() {
            var search = document.getElementById('searchInput').value.toLowerCase();
            var filtered = allUsers;
            if (search) {
                filtered = filtered.filter(function(u) {
                    return (u.name || '').toLowerCase().includes(search) ||
                           (u.email || '').toLowerCase().includes(search) ||
                           (u.phone || '').toLowerCase().includes(search);
                });
            }
            document.getElementById('totalUsers').textContent = filtered.length;
            renderUsers(filtered);
        }

        function renderUsers(users) {
            var container = document.getElementById('usersList');
            if (users.length === 0) {
                container.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><p>No users found</p></div>';
                return;
            }
            var html = '';
            users.forEach(function(u, i) {
                var initial = (u.name || u.email || 'U').charAt(0).toUpperCase();
                var color = colors[i % colors.length];
                html += '<div class="card" onclick="openUserDetail(\'' + u.uid + '\')">' +
                    '<div class="card-header"><div style="display:flex;align-items:center;gap:10px;">' +
                    '<div class="user-avatar" style="background:' + color + '">' + initial + '</div>' +
                    '<div><div class="card-name">' + escapeHtml(u.name || 'Unknown') + '</div>' +
                    '<div class="card-subject">' + escapeHtml(u.email || 'No email') + '</div></div></div></div></div>';
            });
            container.innerHTML = html;
        }

        function openUserDetail(uid) {
            var u = allUsers.find(function(x) { return x.uid === uid; });
            if (!u) return;
            var html = '<div class="detail-row"><div class="detail-label">User ID</div><div class="detail-value" style="font-family:monospace;font-size:11px;">' + u.uid + '<button class="copy-btn" onclick="copyText(\'' + u.uid + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></div></div>' +
                '<div class="detail-row"><div class="detail-label">Name</div><div class="detail-value">' + (u.name || 'N/A') + '<button class="copy-btn" onclick="copyText(\'' + (u.name || '') + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></div></div>' +
                '<div class="detail-row"><div class="detail-label">Email</div><div class="detail-value">' + (u.email || 'N/A') + '<button class="copy-btn" onclick="copyText(\'' + (u.email || '') + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></div></div>' +
                '<div class="detail-row"><div class="detail-label">Phone</div><div class="detail-value">' + (u.phone || 'N/A') + '<button class="copy-btn" onclick="copyText(\'' + (u.phone || '') + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></div></div>' +
                '<div class="detail-row"><div class="detail-label">Full Data</div><div class="detail-value"><pre style="background:#f8fafc;padding:10px;border-radius:8px;font-size:11px;overflow-x:auto;white-space:pre-wrap;border:1px solid #e2e8f0;">' + JSON.stringify(u, null, 2) + '</pre><button class="copy-btn" onclick="copyText(JSON.stringify(allUsers.find(x=>x.uid===\'' + uid + '\'),null,2))" style="margin-top:6px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy All</button></div></div>';
            document.getElementById('userModalBody').innerHTML = html;
            document.getElementById('userModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
        }

        document.getElementById('userModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
