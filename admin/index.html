<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>CrickSo Admin</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <svg viewBox="0 0 32 32" fill="none">
                    <rect width="32" height="32" rx="8" fill="#2563eb"/>
                    <path d="M8 16c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="16" cy="16" r="3" fill="#fff"/>
                </svg>
                <div>
                    <div class="logo-text">CrickSo Admin</div>
                    <div class="logo-sub">Dashboard</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="location.reload()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                </button>
            </div>
        </div>
    </header>

    <div class="main">
        <div class="stats-grid">
            <div class="stat-card stat-total">
                <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
                <div class="stat-number" id="totalComplaints">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card stat-pending">
                <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                <div class="stat-number" id="pendingCount">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card stat-resolved">
                <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
                <div class="stat-number" id="resolvedCount">0</div>
                <div class="stat-label">Resolved</div>
            </div>
            <div class="stat-card stat-rejected">
                <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>
                <div class="stat-number" id="rejectedCount">0</div>
                <div class="stat-label">Rejected</div>
            </div>
        </div>

        <div class="section-header">
            <span class="section-title">Recent Complaints</span>
            <a href="complaints.html" class="view-all">View All</a>
        </div>
        <div id="recentComplaints"></div>
    </div>

    <div class="toast" id="toast"></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="complaints.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            <span>Complaints</span>
        </a>
        <a href="users.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            <span>Users</span>
        </a>
        <a href="settings.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            <span>Settings</span>
        </a>
    </nav>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (initFirebase()) {
                syncComplaintsFromFirebase(function(complaints) {
                    var total = complaints.length, pending = 0, resolved = 0, rejected = 0;
                    complaints.forEach(function(c) {
                        var s = c.status || 'pending';
                        if (s === 'pending') pending++;
                        else if (s === 'resolved') resolved++;
                        else if (s === 'rejected') rejected++;
                    });
                    document.getElementById('totalComplaints').textContent = total;
                    document.getElementById('pendingCount').textContent = pending;
                    document.getElementById('resolvedCount').textContent = resolved;
                    document.getElementById('rejectedCount').textContent = rejected;

                    var recent = complaints.slice(0, 5);
                    var container = document.getElementById('recentComplaints');
                    if (recent.length === 0) {
                        container.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><p>No complaints yet</p></div>';
                        return;
                    }
                    var html = '';
                    recent.forEach(function(c) {
                        var date = c.createdAt ? new Date(c.createdAt).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) : '';
                        var statusClass = 'badge-' + (c.status || 'pending');
                        html += '<div class="card" onclick="window.location.href=\'complaints.html?view=' + c.id + '\'">' +
                            '<div class="card-header"><span class="card-id">#' + (c.id || '').slice(-6).toUpperCase() + '</span><span class="badge ' + statusClass + '">' + (c.status || 'pending') + '</span></div>' +
                            '<div class="card-name">' + escapeHtml(c.name || 'Unknown') + '</div>' +
                            '<div class="card-subject">' + escapeHtml(c.subject || c.type || 'No subject') + '</div>' +
                            '<div class="card-footer"><span class="card-date">' + date + '</span></div></div>';
                    });
                    container.innerHTML = html;
                });
            }
        });
    </script>
</body>
</html>
